<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>so_algoritmos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 1. Encabezado (header): título del sitio y descripción breve del proyecto -->


<!-- 2. Barra de navegación (navbar): enlaces a las secciones principales de la página -->


<!-- 3. Sección hero: título destacado, texto introductorio y botón de llamada a la acción -->


<!-- 4. Tarjeta (card) de algoritmo: nombre, descripción corta e imagen/ícono representativo -->


<!-- 5. Grilla de tarjetas: contenedor que muestra varias tarjetas de algoritmos en formato de cuadrícula -->


<!-- 6. Botón primario reutilizable: estilo consistente para acciones principales -->


<!-- 7. Botón secundario reutilizable: estilo alternativo para acciones secundarias -->


<!-- 8. Formulario de búsqueda: campo de texto y botón para buscar un algoritmo por nombre -->


<!-- 9. Menú desplegable (dropdown): selector de categoría de algoritmos (CPU, memoria, disco, etc.) -->


<!-- 10. Pestañas (tabs): alternar entre distintas vistas de contenido sin recargar la página -->


<!-- 11. Acordeón (accordion): preguntas frecuentes o explicaciones plegables por sección -->


<!-- 12. Modal / ventana emergente: muestra el detalle de un algoritmo al hacer clic en su tarjeta -->


<!-- 13. Tooltip: texto de ayuda que aparece al pasar el cursor sobre un ícono o término técnico -->


<!-- 14. Tabla de datos: comparación de algoritmos con columnas (nombre, complejidad, uso) -->


<!-- 15. Barra de progreso: indicador visual de avance (por ejemplo, ejecución de una simulación) -->


<!-- 16. Alerta / notificación: mensaje de éxito, error o aviso mostrado al usuario -->


<!-- 17. Carrusel / slider: rotación de imágenes o ejemplos destacados -->


<!-- 18. Formulario de contacto: nombre, correo y mensaje, con validación básica -->


<!-- 19. Paginación: navegación entre páginas de resultados o listados largos -->


<!-- 20. Pie de página (footer): datos de contacto, créditos y enlaces a redes o repositorio -->


</body>
</html>
